<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시험 공부 플래너</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22512%22 height=%22512%22 viewBox=%220 0 100 100%22%3E%3Crect x=%220%22 y=%220%22 width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23d97757%22/%3E%3Cg transform=%22translate(13 13) scale(3.0833333333333335)%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%222.75%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M8 2v3%22/%3E%3Cpath d=%22M16 2v3%22/%3E%3Crect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/%3E%3Cpath d=%22M3 9h18%22/%3E%3Cpath d=%22m9 15 2 2 4-4%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #FAF9F5; --panel: #F0EEE6; --panel2: #E8E6DC; --text: #1F1E1D; --muted: #6B6A64; --line: #DEDBCD;
  --accent: #D97757; --accent-strong: #B5502D; --accent-ink: #FFFFFF; --focus: #D97757;
  --red: #C8423B; --red-text: #B0332C; --blue-text: #2F6FA3; --green-text: #3F7A4D;
  --lv-calm: #5B9A68; --lv-easy: #9AAE4B; --lv-normal: #D8A532; --lv-busy: #E07B39; --lv-packed: #C8423B;
  --fillmax: 34%; --shadow: 0 8px 30px rgba(31, 30, 29, .16);
  --font: "Pretendard Variable", Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "Geist Mono", "Pretendard Variable", Pretendard, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --field: 15px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #262624; --panel: #30302E; --panel2: #3A3A37; --text: #F5F4EE; --muted: #A8A69C; --line: #4A4A45;
  --accent: #D97757; --accent-strong: #C6613F; --red: #E0645C; --red-text: #FF8F86; --blue-text: #8DB8E6; --green-text: #8CC79A;
  --lv-calm: #6FB07C; --lv-easy: #B0C45E; --lv-normal: #E3B54A; --lv-busy: #E88A4B; --lv-packed: #E0645C;
  --fillmax: 26%; --shadow: 0 8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #262624; --panel: #30302E; --panel2: #3A3A37; --text: #F5F4EE; --muted: #A8A69C; --line: #4A4A45;
    --accent: #D97757; --accent-strong: #C6613F; --red: #E0645C; --red-text: #FF8F86; --blue-text: #8DB8E6; --green-text: #8CC79A;
    --lv-calm: #6FB07C; --lv-easy: #B0C45E; --lv-normal: #E3B54A; --lv-busy: #E88A4B; --lv-packed: #E0645C;
    --fillmax: 26%; --shadow: 0 8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* 공통 컨트롤 */
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--panel2); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.primary { background: var(--accent-strong); color: var(--accent-ink); border-color: var(--accent-strong); font-weight: 600; }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--red-text); border-color: var(--red-text); background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon { width: 32px; height: 32px; min-width: 32px; display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 0; }
.icon:hover { background: var(--panel2); }
.icon[aria-pressed="true"] { background: var(--panel2); border-color: var(--line); }
.icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input[type="text"], input[type="date"], input[type="number"], input[type="url"], select, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; min-height: 34px; width: 100%; font-size: var(--field);
}
textarea { resize: vertical; min-height: 72px; }
input[type="number"] { width: 72px; text-align: center; font-family: var(--mono); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f > span { font-weight: 600; }
.err { color: var(--red-text); font-size: 13px; margin: 6px 0 0; text-decoration: underline wavy var(--red-text) 1px; text-underline-offset: 3px; text-decoration-skip-ink: none; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }

/* 상단 */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.top-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; flex-wrap: wrap; }
.top-row .spacer { flex: 1; }
.exam-pick { min-width: 140px; max-width: 280px; width: auto; font-weight: 600; }
.sync { font-size: 12px; color: var(--muted); max-width: 260px; text-align: right; }
.sync[data-s="error"] { color: var(--red-text); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-bottom: 2px solid transparent; font-weight: 600; color: var(--muted); min-height: 38px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.hprog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; width: 100%; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hprog .bar { width: 90px; }

main { padding: 16px 0 80px; }
h2.sec { font-size: 16px; margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stack { display: grid; gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* 과목 칩 */
.subchip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; border-radius: 8px; padding: 4px 10px; min-height: 34px; max-width: 100%;
  background: color-mix(in srgb, var(--c) 30%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 75%, var(--text) 10%); }
.subchip b { font-weight: 600; }
.subchip small { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subchip[data-dragging] { opacity: .4; }
.eday { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); align-items: start; }
.eday + .eday { margin-top: 8px; }
.eday .lab { font-weight: 600; }
.eday .lab small { display: block; font-weight: 400; color: var(--muted); }
.eday[data-drop] { outline: 2px dashed var(--focus); outline-offset: -2px; background: var(--panel); }
.eday .items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
form.add { display: inline-flex; gap: 4px; align-items: center; }
form.add input { width: 150px; min-height: 34px; }

/* 준비 계획 */
.board { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.vault { position: sticky; top: 104px; max-height: calc(100vh - 124px); overflow: auto; }
.vault .grp + .grp { margin-top: 12px; }
.vault .gh { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 1px solid color-mix(in srgb, var(--c) 60%, var(--text)); display: inline-block; flex: none; }
.vault .items, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.vault[data-drop], .day[data-drop] { outline: 2px dashed var(--focus); outline-offset: -2px; }
.vault-toggle { display: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .spacer { flex: 1; }
.bulk { position: sticky; top: 104px; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--red-text); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; background: color-mix(in srgb, var(--red) 12%, var(--bg)); }
.week { font-size: 12px; color: var(--muted); margin: 14px 2px 6px; font-family: var(--mono); }
.day { --lv: var(--lv-normal); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel);
  background: color-mix(in srgb, var(--lv) calc(var(--fill, 0) * var(--fillmax)), var(--bg)); }
.day[data-level="calm"] { --lv: var(--lv-calm); }
.day[data-level="easy"] { --lv: var(--lv-easy); }
.day[data-level="normal"] { --lv: var(--lv-normal); }
.day[data-level="busy"] { --lv: var(--lv-busy); }
.day[data-level="packed"] { --lv: var(--lv-packed); }
.day[data-over] { --lv: var(--red); border-color: var(--red-text); }
.day[data-today] { outline: 2px solid var(--focus); outline-offset: 1px; }
.day[data-sel] { box-shadow: inset 0 0 0 2px var(--accent-strong); }
.day[data-past] { opacity: .72; }
.dh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dh input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent-strong); }
.date { font-weight: 700; min-width: 72px; font-family: var(--mono); font-size: 14px; }
.date .wd { font-family: var(--font); font-weight: 600; margin-left: 4px; }
.date[data-w="0"], .date[data-hol] { color: var(--red-text); }
.date[data-w="6"] { color: var(--blue-text); }
.date[data-hol] { color: var(--red-text); }
.tag { font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); line-height: 20px; white-space: nowrap; }
.tag.today { border-color: var(--focus); color: var(--focus); font-weight: 600; }
.note { flex: 1 1 140px; min-width: 100px; max-width: 280px; min-height: 28px; padding: 2px 8px; border-color: transparent; background: transparent; font-size: 13px; }
.note:hover, .note:focus { border-color: var(--line); background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 2px 9px; min-height: 28px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-strong); color: var(--accent-ink); }
.cnt { font-family: var(--mono); font-size: 13px; min-width: 40px; text-align: right; }
.cnt[data-over] { color: var(--red-text); font-weight: 700; }
.eline { font-size: 12px; margin: 4px 0 0 26px; color: var(--muted); }
.chips { margin-top: 6px; min-height: 12px; }

.chip { display: inline-flex; align-items: center; gap: 2px; border-radius: 8px; padding: 0 2px 0 2px; min-height: 32px; max-width: 100%;
  background: color-mix(in srgb, var(--c) 32%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 75%, var(--text) 10%); }
.chip[data-done] .lb { text-decoration: line-through; opacity: .6; }
.chip[data-dragging] { opacity: .4; }
.chip .ck, .chip .lb { border: 0; background: transparent; }
.chip .ck { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; padding: 0; }
.chip .ck span { width: 16px; height: 16px; border: 1.8px solid var(--text); border-radius: 4px; display: grid; place-items: center; background: var(--bg); }
.chip .ck svg { width: 12px; height: 12px; stroke: var(--text); fill: none; stroke-width: 3; opacity: 0; }
/* check */
.chip[data-done] .ck svg { opacity: 1; }
.chip .lb { padding: 2px 6px; text-align: left; min-height: 28px; display: inline-flex; align-items: center; gap: 6px; }
.chip .lb svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
.chip[draggable="true"] { cursor: grab; }

/* 오늘 */
.today { display: grid; gap: 16px; max-width: 760px; }
.trow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px;
  background: color-mix(in srgb, var(--c) 28%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 70%, var(--text) 10%); }
.trow .ck { width: 36px; height: 36px; border: 0; background: transparent; display: grid; place-items: center; border-radius: 8px; padding: 0; }
.trow .ck span { width: 22px; height: 22px; border: 2px solid var(--text); border-radius: 6px; background: var(--bg); display: grid; place-items: center; }
.trow .ck svg { width: 15px; height: 15px; stroke: var(--text); fill: none; stroke-width: 3; opacity: 0; }
.trow[data-done] .ck svg { opacity: 1; }
.trow[data-done] .tl { text-decoration: line-through; opacity: .6; }
.trow .tl { flex: 1; font-size: 16px; font-weight: 600; }
.trow .tl small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 14px; }
.big { font-size: 28px; font-weight: 700; font-family: var(--mono); }

/* 패널 */
#scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 40; }
#panel { position: fixed; z-index: 50; background: var(--bg); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
#panel.drawer { top: 0; right: 0; bottom: 0; width: min(460px, 100vw); border-radius: 12px 0 0 12px; }
#panel.sheet { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 24px)); max-height: min(78vh, 640px); border-radius: 14px; }
#panel > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); padding-top: max(12px, env(safe-area-inset-top)); }
#panel > header h2 { margin: 0; font-size: 16px; }
#panelBody { padding: 14px; overflow: auto; display: grid; gap: 14px; align-content: start; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
.pick { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; border-radius: 8px; padding: 6px 10px; min-height: 40px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--lv) calc(var(--fill, 0) * var(--fillmax)), var(--bg)); --lv: var(--lv-normal); }
.pick[data-level="calm"] { --lv: var(--lv-calm); } .pick[data-level="easy"] { --lv: var(--lv-easy); } .pick[data-level="busy"] { --lv: var(--lv-busy); } .pick[data-level="packed"] { --lv: var(--lv-packed); }
.pick[data-over] { --lv: var(--red); }
.pick[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--text); }
.pick small { color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg) inset; }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plan label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); justify-items: start; }
.links { display: grid; gap: 6px; }
.link { display: flex; align-items: center; gap: 6px; }
.link a { color: var(--blue-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.confirm { border: 1px solid var(--red-text); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: color-mix(in srgb, var(--red) 10%, var(--bg)); }
.drop-area { border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.drop-area[data-dragover] { border: 2px dashed var(--focus); background: var(--panel); }
.drop-area textarea { border: 0; min-height: 90px; font-family: var(--mono); font-size: 13px; }
.field-group { display: grid; gap: 6px; }
.field-group > .t { font-weight: 600; font-size: 13px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--accent-strong); color: var(--accent-ink); padding: 10px 14px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); font-size: 14px; }

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .vault { position: static; max-height: none; }
  .vault-toggle { display: inline-flex; }
  .vault[data-collapsed] { display: none; }
  .bulk { top: 96px; }
  .eday { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px), (pointer: coarse) {
  :root { --field: 16px; }
  input[type="text"], input[type="date"], input[type="number"], input[type="url"], select, textarea { font-size: 16px; }
  .note { font-size: 16px; }
}
@media (max-width: 720px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .exam-pick { max-width: 100%; flex: 1; }
  .hprog { display: none; }
  .prow { grid-template-columns: 90px minmax(0, 1fr) 48px; }
  #panel.sheet { top: auto; bottom: 0; left: 0; transform: none; width: 100vw; max-height: 86vh; border-radius: 14px 14px 0 0; }
  #panel.drawer { width: 100vw; border-radius: 0; }
}
@media print { .top, #toast { display: none; } }

/* 아이콘, 칩, 팝오버 (추가) */
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.tab svg.i { width: 16px; height: 16px; }
.sz { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sz span { display: inline-flex; align-items: center; gap: 2px; }
.sz svg.i { width: 13px; height: 13px; }
.subchip .l1 { display: flex; align-items: center; gap: 8px; }
.vault .gh .sz { margin-left: auto; }
.chip .lb svg.k { width: 14px; height: 14px; stroke: var(--text); opacity: .75; }
.chip .lb svg.mv { width: 13px; height: 13px; stroke: var(--muted); }
.trow .tl svg.k { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.kind-recap .lb { font-style: normal; }

/* 바쁨 정도 칩 */
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.meter i { width: 4px; border-radius: 1px; background: color-mix(in srgb, var(--text) 18%, transparent); }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 7px; } .meter i:nth-child(3) { height: 9px; } .meter i:nth-child(4) { height: 11px; } .meter i:nth-child(5) { height: 12px; }
.meter i[data-on] { background: var(--lvc, var(--lv-normal)); }
[data-lv="calm"] { --lvc: var(--lv-calm); } [data-lv="easy"] { --lvc: var(--lv-easy); } [data-lv="normal"] { --lvc: var(--lv-normal); } [data-lv="busy"] { --lvc: var(--lv-busy); } [data-lv="packed"] { --lvc: var(--lv-packed); }
.lvchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; min-height: 28px; font-size: 13px; white-space: nowrap; }
.lvchip:hover { background: var(--panel2); }
.lvchip[aria-expanded="true"] { border-color: var(--accent); }
.memo { display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent; background: transparent; border-radius: 8px; min-height: 28px; max-width: 240px; padding: 0 6px; font-size: 13px; color: var(--muted); }
.memo:hover { background: var(--panel2); }
.memo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.memo svg.i { width: 15px; height: 15px; }
.memo[data-has] svg.i { color: var(--accent-strong); }
.dh .grow { flex: 1; }
.cnt { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; }
.cnt svg.i { width: 14px; height: 14px; }

/* 팝오버 */

/* 레이어 순서: 한 곳에서 정한다. 나중에 열리는 층이 위다. */

<script>
'use strict';
/* 시험 공부 플래너 로직. DOM에 의존하지 않는다. */
const Planner = (function () {
  const LEVELS = [
    { key: 'calm', label: '한가함' },
    { key: 'easy', label: '여유' },
    { key: 'normal', label: '보통' },
    { key: 'busy', label: '바쁨' },
    { key: 'packed', label: '매우 바쁨' },
  ];
  const LEVEL_KEYS = LEVELS.map((l) => l.key);
  const DEFAULT_LIMITS = { calm: 8, easy: 4, normal: 3, busy: 2, packed: 1 };
  /* 4단계(v1) 저장본의 단계 이름을 5단계로 옮긴다. */
  const LEGACY_LEVELS = { relaxed: 'calm', medium: 'normal', tight: 'busy', busy: 'packed' };
  const PALETTE = ['#C4705A', '#D9A441', '#7E9F6B', '#5F9EA0', '#6E8FBF', '#9A7DB8', '#C46A8E', '#8A8578'];
  const MAX_DAYS = 120;
  const MAX_COUNT = 30;
  const MAX_TEXT = 2000;

  /* 한국 공휴일(대체공휴일 포함). 공식 월력요항에서 확인된 날짜만 담는다. 날짜별로 직접 고칠 수 있다. */
  const HOLIDAYS = {
    '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
    '2026-03-01': '삼일절', '2026-03-02': '대체공휴일', '2026-05-05': '어린이날', '2026-05-24': '부처님오신날',
    '2026-05-25': '대체공휴일', '2026-06-03': '지방선거일', '2026-06-06': '현충일', '2026-08-15': '광복절',
    '2026-08-17': '대체공휴일', '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴',
    '2026-10-03': '개천절', '2026-10-05': '대체공휴일', '2026-10-09': '한글날', '2026-12-25': '성탄절',
    '2027-01-01': '신정', '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴',
    '2027-02-09': '대체공휴일', '2027-03-01': '삼일절', '2027-05-05': '어린이날', '2027-05-13': '부처님오신날',
    '2027-06-06': '현충일', '2027-08-15': '광복절', '2027-08-16': '대체공휴일', '2027-09-14': '추석 연휴',
    '2027-09-15': '추석', '2027-09-16': '추석 연휴', '2027-10-03': '개천절', '2027-10-04': '대체공휴일',
    '2027-10-09': '한글날', '2027-10-11': '대체공휴일', '2027-12-25': '성탄절', '2027-12-27': '대체공휴일',
  };

  /* ---------- 날짜 ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  function parseISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }
  function toISO(dt) {
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  }
  function isISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const dt = parseISO(s);
    return !isNaN(dt) && toISO(dt) === s;
  }
  function addDays(s, n) {
    const d = parseISO(s);
    d.setUTCDate(d.getUTCDate() + n);
    return toISO(d);
  }
  function diffDays(a, b) {
    return Math.round((parseISO(b) - parseISO(a)) / 86400000);
  }
  function weekday(s) {
    return parseISO(s).getUTCDay();
  }
  function rangeDays(a, b) {
    const out = [];
    if (!isISO(a) || !isISO(b) || a > b) return out;
    for (let d = a; d <= b && out.length <= 400; d = addDays(d, 1)) out.push(d);
    return out;
  }
  function todayISO() {
    const n = new Date();
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  }

  let uidSeq = 0;
  function uid() {
    uidSeq += 1;
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + uidSeq.toString(36);
  }

  const clampInt = (v, lo, hi) => {
    const n = Math.round(Number(v));
    return isNaN(n) ? lo : Math.min(hi, Math.max(lo, n));
  };
  const normName = (s) => String(s || '').trim().replace(/\s+/g, ' ');
  const nameKey = (s) => normName(s).toLowerCase();

  /* ---------- 상태 ---------- */
  function newState() {
    return { v: 3, limits: Object.assign({}, DEFAULT_LIMITS), recapDays: 7, week: {}, defPlan: Object.assign({}, DEFAULT_PLAN), library: [], exams: [], activeId: null, updatedAt: 0 };
  }

  function validateExamFields(f) {
    const name = normName(f.name);
    if (!name) return '시험 이름을 입력해 주세요.';
    if (!isISO(f.start) || !isISO(f.end)) return '시작일과 종료일을 입력해 주세요.';
    if (f.end < f.start) return '종료일은 시작일 이후여야 합니다.';
    const prep = f.prepStart || addDays(f.start, -28);
    if (!isISO(prep)) return '준비 시작일을 입력해 주세요.';
    if (prep > f.end) return '준비 시작일은 종료일 이전이어야 합니다.';
    if (diffDays(prep, f.end) + 1 > MAX_DAYS) return '준비 기간과 시험 기간을 합쳐 ' + MAX_DAYS + '일 이내로 정해 주세요.';
    return null;
  }

  function newExam(f) {
    const err = validateExamFields(f);
    if (err) return { error: err };
    return {
      exam: {
        id: uid(), name: normName(f.name), start: f.start, end: f.end,
        prepStart: f.prepStart || addDays(f.start, -28), subs: [], tasks: [], days: {}, week: {},
      },
    };
  }

  /* 날짜가 바뀌면 범위를 벗어난 배치는 보관함으로 돌아간다. 돌아간 개수를 반환한다. */
  function updateExamFields(exam, f) {
    const err = validateExamFields(f);
    if (err) return { error: err };
    const prep = f.prepStart || addDays(f.start, -28);
    exam.name = normName(f.name);
    exam.start = f.start;
    exam.end = f.end;
    exam.prepStart = prep;
    let unplaced = 0;
    exam.tasks.forEach((t) => {

  const getExam = (state, id) => state.exams.find((e) => e.id === id) || null;

  /* ---------- 과목 라이브러리 ---------- */
  function pickColor(state) {
    const used = new Set(state.library.map((s) => s.color));

  }
  function findSubject(state, name) {
    const k = nameKey(name);
    return state.library.find((s) => nameKey(s.name) === k) || null;
  }
  function ensureSubject(state, name) {
    const n = normName(name).slice(0, 40);
    if (!n) return null;

      s = { id: uid(), name: n, color: pickColor(state) };

    }

  }
  function renameSubject(state, id, name) {
    const n = normName(name).slice(0, 40);

    const other = findSubject(state, n);
    if (other && other.id !== id) return { error: '이미 있는 과목명입니다.' };
    const s = state.library.find((x) => x.id === id);

  }
  const subjectOf = (state, es) => state.library.find((s) => s.id === es.subjectId) || { name: '(이름 없음)', color: PALETTE[7] };

  /* ---------- 시험 과목 ---------- */
  const DEFAULT_PLAN = { n: 2, m: 2, r: 1 };

  function cleanPlan(p) {

  }
  /* 요일별 기본 바쁨 정도: { '1': 'busy', ... } (0 일요일 ~ 6 토요일) */

  }
  /* 쉼표, 슬래시, 줄바꿈으로 나눈 여러 과목을 한 번에 추가한다. */
  function addSubs(state, exam, text, examDate) {
    const names = String(text || '').split(/[,，、\/\n]+/).map((x) => normName(x)).filter(Boolean);
    let added = 0, dup = 0, last = null;
    names.forEach((nm) => { const r = addSub(state, exam, nm, examDate); if (r.sub) { added++; last = r.sub; } else dup++; });
    if (!names.length) return { error: '과목명을 입력해 주세요.' };

  function addSub(state, exam, name, examDate) {

    const es = {
      id: uid(), subjectId: s.id, examDate: examDate && examDays(exam).includes(examDate) ? examDate : null,
      range: '', comment: '', links: [], plan: cleanPlan(state.defPlan),

  }
  function removeSub(exam, esId) {
    exam.subs = exam.subs.filter((s) => s.id !== esId);
    exam.tasks = exam.tasks.filter((t) => t.esId !== esId);
  }
  function setSubDate(exam, es, iso) {
    if (iso && !examDays(exam).includes(iso)) return false;
    es.examDate = iso || null;

  function normalizeLink(url) {

  const planTotals = (plan) => ({ study: plan.n + plan.m, recap: plan.r });

  function syncTasks(exam, es) {
    const targets = [['s', es.plan.n + es.plan.m], ['r', es.plan.r]];
    for (const [type, target] of targets) {
      const list = exam.tasks.filter((t) => t.esId === es.id && t.type === type).sort((a, b) => a.seq - b.seq);
      while (list.length > target) {
        let idx = -1;
        for (let i = list.length - 1; i >= 0; i--) if (!list[i].date) { idx = i; break; }

        const rm = list.splice(idx, 1)[0];

      while (list.length < target) {

  function taskKind(exam, t) {
    const es = exam.subs.find((s) => s.id === t.esId);

  /* ---------- 날짜별 설정과 배치 ---------- */
  function isHoliday(exam, iso) {

  function moveTask(exam, id, iso) {

  /* 순서 자동정리: 과목별로 배치된 회차를 날짜순으로 다시 번호 매긴다.
     배치된 것들이 차지한 번호 칸만 날짜순으로 재배정하고, 미배치 회차의 번호는 건드리지 않는다. */
  function normalizeOrder(exam) {

      ['s', 'r'].forEach((type) => {

  function toggleDone(exam, id) {

  function overdue(exam, today) {

      libIds.add(s.id);
      st.library.push({ id: s.id.slice(0, 40), name, color: /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : PALETTE[st.library.length % PALETTE.length] });

    raw.exams.forEach((e) => {
      if (!e || typeof e.id !== 'string' || examIds.has(e.id)) return;

      if (diffDays(e.prepStart, e.end) + 1 > MAX_DAYS) return;
      const name = normName(str(e.name, 60));
      if (!name) return;
      examIds.add(e.id);
      const ex = { id: e.id.slice(0, 40), name, start: e.start, end: e.end, prepStart: e.prepStart, subs: [], tasks: [], days: {}, week: cleanWeek(e.week) };

          id: s.id.slice(0, 40), subjectId: s.subjectId, examDate: eDays.includes(s.examDate) ? s.examDate : null,

}
function openData(opener) {
  openPanel('data', S.data, () => {
    const json = () => JSON.stringify(P.exportPayload(state), null, 1);
    const ta = el('textarea', { rows: '4', placeholder: S.importPaste, spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', 'aria-label': S.import, onInput: (e) => { ui.importRaw = e.target.value; } });
    ta.value = ui.importRaw;
    const area = el('div', { class: 'drop-area' }, ta);
    let depth = 0;
    area.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); depth++; area.dataset.dragover = ''; });
    area.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; });
    area.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) delete area.dataset.dragover; });
    area.addEventListener('drop', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); depth = 0; delete area.dataset.dragover; importFiles(Array.from(e.dataTransfer.files)); });
    const fileIn = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onChange: (e) => { importFiles(Array.from(e.target.files)); e.target.value = ''; } });
    return [
      el('div', { class: 'field-group' }, el('div', { class: 't', text: S.export }),
        el('div', { class: 'row' },
          el('button', { type: 'button', class: 'btn primary', 'data-autofocus': '', text: S.exportFile, onClick: async () => { const r = await saveFile('exam-planner.json', json()); if (r === true) toast(S.exported); else if (r === false) toast(S.exportFail); } }),
          el('button', { type: 'button', class: 'btn', text: S.exportCopy, onClick: async () => { toast((await copyText(json())) ? S.copied : S.copyFail); } }))),
      el('div', { class: 'field-group' }, el('div', { class: 't', text: S.import }), area, fileIn,
        el('div', { class: 'row' },
          el('button', { type: 'button', class: 'btn', text: S.importFile, onClick: () => fileIn.click() }),
          el('button', { type: 'button', class: 'btn primary', text: S.importRun, onClick: () => { if (ta.value.trim()) importText(ta.value); } })),
        ui.importMsg ? el('p', { class: ui.importMsg === S.importBad ? 'err' : 'muted', role: 'status', text: ui.importMsg }) : null),
    ];
  }, opener);
}

/* ---------- 시작 ---------- */
function bindGlobal() {
  $('#panelClose').addEventListener('click', () => closePanel());
  $('#scrim').addEventListener('click', () => closePanel());
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (pop.el) { e.preventDefault(); closePopover(true); return; }
    if (!$('#panel').hidden) { e.preventDefault(); closePanel(); }
  });
  document.addEventListener('pointerdown', (e) => {
    if (pop.el && !pop.el.contains(e.target) && !(pop.anchor && pop.anchor.contains(e.target))) closePopover();
  });
  for (const type of ['dragover', 'drop']) {
    window.addEventListener(type, (e) => { if (!hasFiles(e)) return; e.preventDefault(); if (type === 'dragover') e.dataTransfer.dropEffect = 'none'; });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushLocal(); if (remote.timer) { clearTimeout(remote.timer); pushRemote(); } } });
  window.addEventListener('pagehide', () => { flushLocal(); });
}
async function start() {
  loadPrefs(); applyTheme(); bindGlobal();
  document.head.append(el('style', { id: 'printcss', text: PRINT_CSS }));
  const raw = await loadLocal();
  const clean = raw && P.sanitizeState(raw);
  if (clean) state = clean;
  const ex0 = cur();
  if (ui.tab === null) ui.tab = 'board';
  const t0 = P.todayISO();
  const inPrep = !!ex0 && t0 >= ex0.prepStart && t0 <= ex0.end;
  if (isNarrow()) ui.tab = 'today';
  else if (inPrep) ui.tab = 'print';
  if (ex0 && !ex0.subs.length) ui.tab = 'exam';
  ui.scrollToday = true;
  renderAll();
  initRemote();
}
start();
