<!doctype html>
<html lang="ko" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>시험 공부 플래너</title>
    <!-- 아이콘·manifest 링크는 vite.config.ts 의 appIcons 플러그인이 빌드 모드별로 넣는다 -->
    <script>
      // 첫 화면이 그려지기 전에 테마를 정한다(밝은 화면이 번쩍이지 않도록)
      try { var p = JSON.parse(localStorage.getItem('examPlanner.ui') || '{}'); if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
